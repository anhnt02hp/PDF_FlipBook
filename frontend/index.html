<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive PDF Flipbook</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans overflow-x-hidden">

  <!-- HEADER -->
  <header class="w-full bg-slate-800/80 backdrop-blur border-b border-slate-700 py-3 px-6 flex justify-between items-center shadow-lg z-20">
    <div class="flex items-center space-x-3 cursor-pointer" id="btn-home">
      <i class="fa-solid fa-book-open text-indigo-400 text-2xl"></i>
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
        Flipbook Reader
      </h1>
    </div>
    
    <div class="flex items-center space-x-3">
      <button id="btn-show-library" class="bg-slate-700 hover:bg-slate-600 text-white px-3.5 py-2 rounded-lg font-medium text-sm transition flex items-center space-x-2">
        <i class="fa-solid fa-layer-group"></i>
        <span>Tủ sách</span>
      </button>
      <button id="btn-upload-trigger" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center space-x-2 shadow-md">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span>Thêm sách mới</span>
      </button>
    </div>
  </header>

  <!-- MAIN AREA -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
    
    <!-- 1. KỆ SÁCH ĐÃ LOAD SẴN -->
    <div id="library-section" class="w-full max-w-5xl my-auto">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-semibold flex items-center gap-2">
          <i class="fa-solid fa-bookmark text-indigo-400"></i> Sách đã có sẵn trong hệ thống
        </h2>
      </div>
      <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
        <!-- Render danh sách sách bằng JS -->
      </div>
    </div>

    <!-- 2. HỘP UPLOAD SÁCH MỚI (Ẩn mặc định nếu đã có sách) -->
    <div id="upload-box" class="hidden w-full max-w-lg p-8 bg-slate-800 border-2 border-dashed border-slate-600 hover:border-indigo-500 rounded-2xl text-center cursor-pointer transition-all duration-300 shadow-2xl">
      <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
      <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-file-pdf text-3xl"></i>
      </div>
      <h2 class="text-lg font-bold mb-2">Thêm sách mới</h2>
      <p class="text-slate-400 text-sm mb-4">Chọn file PDF chưa có trong danh sách</p>
      <span class="inline-block bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-full font-medium">Tải file PDF</span>
    </div>

    <!-- 3. THANH LOADING KÈM % TIẾN ĐỘ -->
    <div id="loading" class="hidden flex flex-col items-center justify-center p-8">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loading-status" class="text-slate-300 font-medium mb-2">Đang tải...</p>
      <div class="w-64 bg-slate-700 h-2.5 rounded-full overflow-hidden mb-1">
        <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-200"></div>
      </div>
      <span id="progress-text" class="text-xs text-slate-400 font-mono">0%</span>
    </div>

    <!-- 4. FLIPBOOK CONTAINER -->
    <div id="book-container" class="hidden w-full flex justify-center items-center">
      <div id="flipbook"></div>
    </div>

  </main>

  <!-- FOOTER CONTROLS -->
  <footer id="controls" class="w-full bg-slate-800/90 backdrop-blur border-t border-slate-700 py-3 px-6 flex justify-between items-center shadow-lg z-20 opacity-50 pointer-events-none transition">
    <div class="flex items-center space-x-2">
      <button id="btn-prev" class="w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition active:scale-95">
        <i class="fa-solid fa-chevron-left text-sm"></i>
      </button>
      <button id="btn-next" class="w-9 h-9 rounded-lg bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition active:scale-95">
        <i class="fa-solid fa-chevron-right text-sm"></i>
      </button>
    </div>

    <div class="flex items-center space-x-2 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700">
      <span class="text-xs text-slate-400">Trang</span>
      <input type="number" id="page-input" value="1" min="1" class="w-12 bg-slate-800 text-center text-sm rounded border border-slate-600 focus:outline-none focus:border-indigo-500 py-0.5">
      <span class="text-xs text-slate-400">/ <span id="total-pages">0</span></span>
      <button id="btn-go" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-2 py-1 rounded transition ml-1">Đi</button>
    </div>

    <div class="flex items-center">
      <button id="btn-sound-toggle" class="p-2 text-indigo-400 hover:text-white transition" title="Bật/Tắt âm thanh">
        <i class="fa-solid fa-volume-high text-sm"></i>
      </button>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
